<style>

*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-text-size-adjust:100%}

.area{color:var(--sub);font-size:13px;margin-left:14px}
.price{font-size:26px;font-weight:800;letter-spacing:.01em}

.kv{font-size:13px;color:var(--ink);margin:0;padding:0;list-style:none}

.pc{font-size:13px;margin:4px 0 0;padding-left:1.1em}

.card .go{margin-top:auto;padding-top:8px;font-size:13px}
.small{font-size:12px;color:var(--sub)}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}

th{background:#eef3f8;font-weight:600}
.flight{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fl .t{font-size:18px;font-weight:700}
.day{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.day b{font-size:15px}

footer{padding:30px 16px 50px;color:var(--sub);font-size:12px;text-align:center}
.count{font-size:13px;color:var(--sub);margin-left:auto}

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const spots = SP.spots; spots.forEach((s,i)=>s.no=i+1);
$("#note").textContent = SP.note;
$("#foot").textContent = "確認 " + SP.checked_at + "　時間・料金は行く前に公式で確かめてください";
const gmap = s => `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
function card(s){
  const kv=[["内容",s.what],["時間",s.when],["場所",s.where]].filter(([,v])=>v).map(([k,v])=>`<li><b>${k}</b>${esc(v)}</li>`).join("");
  return `<article class="card" data-no="${s.no}" style="cursor:pointer"><div class="no" style="background:${s.cat==="food"?"var(--warm)":"var(--ok)"}">${s.no}</div><h3>${esc(s.name)}</h3>
  <ul class="kv">${kv}</ul>${s.tip?`<ul class="pc"><li class="p">${esc(s.tip)}</li></ul>`:""}
  <div class="go"><a href="${esc(s.src)}" target="_blank" rel="noopener">公式など ↗</a>　<a href="${gmap(s)}" target="_blank" rel="noopener">Google マップ ↗</a></div></article>`;
}
$("#foodCards").innerHTML = spots.filter(s=>s.cat==="food").map(card).join("");
$("#sightCards").innerHTML = spots.filter(s=>s.cat==="sight").map(card).join("");
let m, marks=[], hotelLayer;
if(window.L){
  m=L.map("map",{scrollWheelZoom:false,fadeAnimation:false}).setView([43.06,141.35],13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(m);
  spots.forEach(s=>{
    const ic=L.divIcon({className:"",html:`<div class="pin ${s.cat}">${s.no}</div>`,iconSize:[26,26],iconAnchor:[13,13]});
    const mk=L.marker([s.lat,s.lng],{icon:ic}).bindPopup(`<b>${s.no}. ${esc(s.name)}</b><br>${esc(s.when)}<br><a href="${gmap(s)}" target="_blank" rel="noopener">Google マップ ↗</a>`);
    mk.cat=s.cat; mk.no=s.no; mk.addTo(m); marks.push(mk);
  });
  hotelLayer=L.layerGroup(((STAY&&STAY.hotels)||[]).filter(h=>h.lat).map((h,i)=>L.marker([h.lat,h.lng],{icon:L.divIcon({className:"",html:'<div class="pin h"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).bindTooltip(esc(h.name))));
  const center=marks.filter(x=>x.getLatLng().lat<43.075&&x.getLatLng().lat>43.04&&x.getLatLng().lng>141.32&&x.getLatLng().lng<141.37);
  m.fitBounds(L.featureGroup(center).getBounds(),{padding:[30,30],animate:false});
}
document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{
  if(!m) return;
  if(b.dataset.k==="hotel"){const on=!b.classList.contains("on");b.classList.toggle("on",on);on?hotelLayer.addTo(m):hotelLayer.remove();return;}
  document.querySelectorAll("#filters button:not([data-k=hotel])").forEach(x=>x.classList.toggle("on",x===b));
  marks.forEach(mk=>{(b.dataset.k==="all"||mk.cat===b.dataset.k)?mk.addTo(m):mk.remove();});
});
document.querySelectorAll(".card[data-no]").forEach(c=>c.onclick=e=>{
  if(e.target.closest("a")||!m) return;
  const mk=marks.find(x=>x.no==c.dataset.no); if(!mk) return;
  if(!m.hasLayer(mk)) mk.addTo(m);
  m.setView(mk.getLatLng(),15); mk.openPopup(); $("#map").scrollIntoView({behavior:"smooth",block:"center"});
});
</script>
