<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>札幌 2027 ｜ 旅のしおり</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--ink:#1d2a3a;--sub:#5b6b7d;--line:#e3e8ee;--bg:#f5f8fb;--card:#fff;--accent:#2f6fb2;--warm:#d9643a;--ok:#2e8b57}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.hero{background:linear-gradient(160deg,#21416b 0%,#3f78b5 60%,#9cc3e6 100%);color:#fff;padding:36px 20px 28px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff55 1.2px,transparent 1.5px),radial-gradient(#ffffff33 1px,transparent 1.2px);background-size:46px 46px,23px 23px;background-position:0 0,11px 17px;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero h1{margin:0;font-size:34px;letter-spacing:.06em}
.hero .dates{margin-top:4px;font-size:15px;opacity:.95}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:#ffffff26;border:1px solid #ffffff55;border-radius:99px;padding:3px 12px;font-size:13px}
.wrap{max-width:860px;margin:0 auto}
nav{position:sticky;top:0;z-index:5;background:#fffffff0;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;overflow-x:auto}
nav a{flex:0 0 auto;padding:12px 16px;text-decoration:none;color:var(--sub);font-size:14px;font-weight:600}
nav a:hover{color:var(--accent)}
section{padding:26px 16px 6px;scroll-margin-top:46px}
nav .wrap{scrollbar-width:none}nav .wrap::-webkit-scrollbar{display:none}
h2{font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 small{font-size:12px;color:var(--sub);font-weight:400}
.note{background:#fff8e8;border:1px solid #f1dfb3;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tools button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.tools button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative}
.no{position:absolute;top:-10px;left:-8px;background:var(--ink);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px}
.card h3{margin:0 0 0 14px;font-size:16px;line-height:1.35}
.area{color:var(--sub);font-size:13px;margin-left:14px}
.price{font-size:26px;font-weight:800;letter-spacing:.01em}
.price small{font-size:12px;font-weight:400;color:var(--sub)}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;margin-right:4px;font-weight:600}
.tag.in{background:#e3f3ea;color:var(--ok)}.tag.over{background:#fde9e1;color:var(--warm)}
.kv{font-size:13px;color:var(--ink);margin:0;padding:0;list-style:none}
.kv li{padding:2px 0;border-top:1px dashed var(--line)}
.kv b{color:var(--sub);font-weight:600;display:inline-block;min-width:4.2em}
.pc{font-size:13px;margin:4px 0 0;padding-left:1.1em}
.pc li.p::marker{content:"＋ ";color:var(--ok)}.pc li.c::marker{content:"− ";color:var(--warm)}
.card .go{margin-top:auto;padding-top:8px;font-size:13px}
.small{font-size:12px;color:var(--sub)}
table{border-collapse:collapse;width:100%;font-size:13px;background:#fff;border-radius:10px;overflow:hidden}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#eef3f8;font-weight:600}
.flight{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fl .t{font-size:18px;font-weight:700}
.day{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.day b{font-size:15px}
#map,.map{height:360px;border:1px solid var(--line);border-radius:12px;margin:0 0 14px;z-index:0}
.pin{background:var(--ink);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.pin.ab{background:#e0565b}.pin.food{background:var(--warm)}.pin.sight{background:var(--ok)}.pin.h{background:#8796a8;width:14px;height:14px;font-size:0}
.lbl{font-size:11px;padding:0 4px;opacity:.85}
.acc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.acc .row{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:4px 0}
footer{padding:30px 16px 50px;color:var(--sub);font-size:12px;text-align:center}
.count{font-size:13px;color:var(--sub);margin-left:auto}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <h1 id="title"></h1>
  <div class="dates" id="dates"></div>
  <div class="chips" id="chips"></div>
</div></header>
<nav><div class="wrap">
  <a href="#stay">🏨 宿</a><a href="#plan">🗓 日程</a><a href="#flight">✈ 飛行機</a><a href="#access">🚃 空港から</a><a href="#links">🔗 リンク</a><a href="guide.html">🍜 ごはん・観光</a>
</div></nav>
<main class="wrap">
  <section id="stay">
    <h2>宿をえらぶ <small id="checked"></small></h2>
    <div class="note" id="stayNote"></div>
    <div class="tools" id="sorts">
      <button data-k="no" class="on">番号順</button><button data-k="price">安い順</button><button data-k="walk">駅に近い順</button><button data-k="rating">評価順</button>
      <button data-k="table">表で比べる</button>
    </div>
    <div id="map"></div>
    <p class="small" style="margin-top:-8px">黒＝ホテル、赤＝Airbnb（Airbnb は予約前はおおよその位置）。番号はカードの番号。</p>
    <div class="grid" id="cards"></div>
    <div class="tbl" id="table" hidden></div>
    <p class="small" id="taxNote"></p>
  </section>
  <section id="plan"><h2>日程 <small>決まったら足していきます</small></h2><div id="days"></div></section>
  <section id="flight"><h2>飛行機</h2><div class="flight" id="flights"></div><p class="small" id="flightNote"></p></section>
  <section id="access"><h2>空港から街へ</h2><div id="accs"></div></section>
  <section id="links"><h2>リンク</h2><ul id="linkList"></ul></section>
</main>
<footer id="foot"></footer>

const $ = s => document.querySelector(s);
const yen = n => (n==null? "—" : n.toLocaleString("ja-JP")+" 円");
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#title").textContent = TRIP.title;
$("#dates").textContent = TRIP.dates + "・" + TRIP.people + " 人";
const days = Math.ceil((new Date(TRIP.start+"T00:00:00+09:00") - new Date())/86400000);
$("#chips").innerHTML = `<span class="chip">${esc(TRIP.status)}</span>` + (days>0?`<span class="chip">出発まで あと ${days} 日</span>`:"");
$("#stayNote").innerHTML = esc(TRIP.budget_note)+"<br><b>"+esc(TRIP.choose_note)+"</b>";
const hotels = (STAY && STAY.hotels) || [];
hotels.forEach((h,i)=>h.no=i+1);
$("#checked").textContent = STAY && STAY.checked_at ? `値段は ${STAY.checked_at} 時点（変わります）` : "";
$("#taxNote").textContent = TRIP.price_note || "";
const B = TRIP.budget_per_person;
function card(h){
  const over = h.over_budget || (h.price_per_person && B && h.price_per_person > B);
  const tag = h.price_per_person==null ? "" : over ? '<span class="tag over">目安オーバー</span>' : '<span class="tag in">目安内</span>';
  const kv = [["部屋",h.room+(h.size_sqm?`（${h.size_sqm}㎡${h.rooms_count>1?"・"+h.rooms_count+" 室":""}）`:"")],["ベッド",h.beds],["食事",h.meal],["お風呂",h.bath],["取消",h.cancel],["評価",h.rating]]
    .filter(([,v])=>v).map(([k,v])=>`<li><b>${k}</b>${esc(v)}</li>`).join("");
  const pc = (h.pros||[]).map(x=>`<li class="p">${esc(x)}</li>`).join("")+(h.cons||[]).map(x=>`<li class="c">${esc(x)}</li>`).join("");
  return `<article class="card"><div class="no">${h.no}</div><h3>${esc(h.name)}</h3>
  <div class="area">${esc(h.area)}${h.station?"・"+esc(h.station):""}${h.walk_min!=null?" 徒歩 "+h.walk_min+" 分":""}</div>
  <div class="price">${h.price_per_person==null?"—":"¥"+h.price_per_person.toLocaleString("ja-JP")} <small>/ 人・2 泊</small></div>
  <div>${tag}<span class="small">5 人で ${yen(h.price_total)}</span></div>
  ${h.price_before_pp?`<div class="small">ポイント還元前の支払いは 1 人 ¥${h.price_before_pp.toLocaleString("ja-JP")}（${esc(String(h.points||"").split("（")[0])} 分が戻る）</div>`:""}
  <ul class="kv">${kv}</ul><ul class="pc">${pc}</ul>
  ${h.url?`<div class="go"><a href="${esc(h.url)}" target="_blank" rel="noopener">予約ページを見る ↗</a></div>`:""}</article>`;
}
function rnum(r){const m=String(r||"").match(/[\d.]+/);return m?parseFloat(m[0]):0}
function render(k){
  let list=[...hotels];
  if(k==="price") list.sort((a,b)=>(a.price_per_person??1e9)-(b.price_per_person??1e9));
  if(k==="walk") list.sort((a,b)=>(a.walk_min??99)-(b.walk_min??99));
  if(k==="rating") list.sort((a,b)=>rnum(b.rating)-rnum(a.rating));
  $("#cards").innerHTML = list.map(card).join("") || '<p class="small">候補を準備中です。</p>';
}
function table(){
  const rows=hotels.map(h=>`<tr><td>${h.no}</td><td>${esc(h.name)}</td><td>${h.price_per_person==null?"—":"¥"+h.price_per_person.toLocaleString("ja-JP")}</td><td>${esc(h.station)} ${h.walk_min??""}分</td><td>${esc(h.room)}</td><td>${esc(h.beds)}</td><td>${esc(h.meal)}</td><td>${esc(h.bath)}</td><td>${esc(h.rating)}</td></tr>`).join("");
  $("#table").innerHTML=`<table><tr><th>#</th><th>宿</th><th>1人2泊</th><th>駅</th><th>部屋</th><th>ベッド</th><th>食事</th><th>お風呂</th><th>評価</th></tr>${rows}</table>`;
}
document.querySelectorAll("#sorts button").forEach(b=>b.onclick=()=>{
  if(b.dataset.k==="table"){const t=$("#table");t.hidden=!t.hidden;b.classList.toggle("on",!t.hidden);if(!t.hidden)table();return;}
  document.querySelectorAll("#sorts button:not([data-k=table])").forEach(x=>x.classList.toggle("on",x===b));render(b.dataset.k);
});
render("no");
if(window.L){
  const m=L.map("map",{scrollWheelZoom:false,fadeAnimation:false}).setView([43.055,141.35],14);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(m);
  m.createPane("lbl").style.zIndex=550;
  const pts=[];
  hotels.filter(h=>h.lat).forEach(h=>{
    const ic=L.divIcon({className:"",html:`<div class="pin${h.id.startsWith("ab-")?" ab":""}">${h.no}</div>`,iconSize:[26,26],iconAnchor:[13,13]});
    L.marker([h.lat,h.lng],{icon:ic}).addTo(m).bindPopup(`<b>${h.no}. ${esc(h.name)}</b><br>${h.price_per_person?"1 人 ¥"+h.price_per_person.toLocaleString("ja-JP"):""}${h.pos_note?"<br><small>"+esc(h.pos_note)+"</small>":""}${h.url?`<br><a href="${esc(h.url)}" target="_blank" rel="noopener">予約ページ ↗</a>`:""}`);
    pts.push([h.lat,h.lng]);
  });
  [["札幌駅",43.0686,141.3508],["大通",43.0607,141.3542],["すすきの",43.0554,141.3534],["中島公園",43.0466,141.3546]].forEach(([n,a,b])=>L.circleMarker([a,b],{radius:5,color:"#2f6fb2",fillOpacity:1}).addTo(m).bindTooltip(n,{permanent:true,direction:"bottom",pane:"lbl",className:"lbl"}));
  if(pts.length) m.fitBounds(pts,{padding:[30,30],animate:false});
}
$("#days").innerHTML = TRIP.days.map(d=>`<div class="day"><b>${esc(d.day)}</b>　${esc(d.plan)}<div class="small">${esc(d.todo)}</div></div>`).join("");
$("#flights").innerHTML = TRIP.flights.map(f=>`<div class="fl"><div class="small">${esc(f.day)}・${esc(f.label)}・${esc(f.flight)}</div><div class="t">${esc(f.from)} → ${esc(f.to)}</div></div>`).join("");
$("#flightNote").textContent = TRIP.flight_note;
$("#accs").innerHTML = TRIP.access.map(a=>`<div class="acc"><b>${esc(a.name)}</b> <span class="small">${esc(a.route)}</span><div class="row"><span>⏱ ${esc(a.time)}</span><span>💴 ${esc(a.fare)}</span></div><div class="small">${esc(a.note)}　<a href="${esc(a.url)}" target="_blank" rel="noopener">公式 ↗</a></div></div>`).join("");
$("#linkList").innerHTML = TRIP.links.map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a></li>`).join("");
$("#foot").textContent = "最終更新 " + TRIP.updated + "　値段・空きは予約サイトで最新を確かめてください";
</script>
